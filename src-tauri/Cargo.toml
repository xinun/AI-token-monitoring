[package]
name = "ai-token"
version = "0.2.0"
description = "Lightweight subscription quota tray monitor"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13.2"
tauri-plugin-opener = "2"
semver = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
